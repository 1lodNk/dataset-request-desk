[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with high-signal correctness rules; broaden after existing findings are resolved.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
