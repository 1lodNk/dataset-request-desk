name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: desk, POSTGRES_PASSWORD: desk, POSTGRES_DB: desk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check app tests migrations
      - name: Mypy type check
        run: python -m mypy app
      - name: Tests on SQLite with coverage report
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Tests on PostgreSQL (includes concurrency tests)
        run: python -m pytest
        env: { TEST_DATABASE_URL: "postgresql+psycopg://desk:desk@localhost:5432/desk_test" }
      - name: Migrations round-trip on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env: { DATABASE_URL: "postgresql+psycopg://desk:desk@localhost:5432/desk_test" }

  frontend-lock-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Generate exact frontend dependencies and lockfile
        working-directory: frontend
        run: |
          npm install --save-exact react@latest react-dom@latest
          npm install --save-dev --save-exact vite@latest @vitejs/plugin-react@latest
          npm run build
      - name: Export generated lockfile for repository update (temporary)
        run: |
          echo PACKAGE_JSON_B64_BEGIN
          base64 -w0 frontend/package.json
          echo
          echo PACKAGE_JSON_B64_END
          echo PACKAGE_LOCK_B64_BEGIN
          base64 -w0 frontend/package-lock.json
          echo
          echo PACKAGE_LOCK_B64_END
